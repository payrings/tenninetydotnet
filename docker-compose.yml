# 10/90 tenninety - local model serving (single-card llama-swap topology).
#
# Local models are served on the PHYSICAL HOST by llama-swap
# (https://github.com/mostro/llama-swap), which drives one llama.cpp server per profile and
# swaps them on demand. Both the coder profile (qwen-coder) and the reviewer profile
# (devstral-reviewer) share ONE AMD Radeon RX 7900 XTX through llama.cpp's Vulkan backend.
# This file therefore starts NO GPU container and needs neither NVIDIA GPUs nor vLLM.
#
# What this file still provisions:
#   - the internal `tenninety-coder-model` bridge network the sandboxed Coder joins, and
#   - an optional PostgreSQL for the sample spec's technical hints.
#
# Host llama-swap reachability (one-time operator steps; the sandbox stays unchanged):
#   1. Run llama-swap on the host bound to 0.0.0.0:8080 (not 127.0.0.1) so the Docker bridge
#      can reach it, with your ~/llama-swap/config.yaml profiles. If the host firewall drops
#      bridge traffic, add a forward/route for the bridge subnet to 0.0.0.0:8080 only.
#   2. Point sandbox.roles.coder.model_endpoint at the llama-swap URL AS SEEN FROM INSIDE the
#      coder container, e.g. http://172.20.0.1:8080/v1 (substitute your bridge gateway). The
#      model network stays internal; never weaken it just to make host loopback work.
#   3. In .tenninety/config.json (Reviewer and default aider coder run host-side):
#        "provider_mode": "aider",
#        "use_llama_swap": true,
#        "local_models": { "coder": "qwen-coder", "reviewer": "devstral-reviewer" }
#
#   docker compose up -d     # creates the network (+ optional DB); llama-swap runs on the host
#
services:
  # Optional: PostgreSQL matching the sample spec's technical hints.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: example
    ports:
      - "127.0.0.1:5432:5432"
    profiles:
      - sample-db

networks:
  coder-model-internal:
    name: tenninety-coder-model
    internal: true