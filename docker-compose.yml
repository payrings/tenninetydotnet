# 10/90 tenninety - local model serving.
#
# Two OpenAI-compatible MODEL SERVERS expose different coder and reviewer identifiers. They are
# not the disposable Coder/Reviewer execution containers. The Coder model server joins the
# internal `tenninety-coder-model` network so the sandboxed Coder can reach
# http://coder-model:8000/v1 without receiving general network egress. A separate server-egress
# network permits model downloads; pre-populate the cache and remove that attachment for a fully
# offline model server. The defaults require two NVIDIA GPUs; set CODER_GPU_ID/REVIEWER_GPU_ID.
#
#   docker compose up -d
#   # then set .tenninety/config.json:
#   #   "provider_mode": "aider",
#   #   "local_models": {
#   #     "coder": "coder",
#   #     "reviewer": "reviewer",
#   #     "coder_endpoint": "http://localhost:8000/v1",
#   #     "reviewer_endpoint": "http://localhost:8001/v1"
#   #   }
#
services:
  coder-model:
    image: vllm/vllm-openai:latest
    command: >
      --model ${CODER_MODEL:-Qwen/Qwen3.6-27B}
      --served-model-name coder
      --max-model-len 16384
      --gpu-memory-utilization 0.85
    ports:
      - "127.0.0.1:8000:8000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${CODER_GPU_ID:-0}"]
              capabilities: [gpu]
    volumes:
      - hf-cache:/root/.cache/huggingface
    networks:
      - coder-model-internal
      - model-server-egress
    restart: unless-stopped

  reviewer-model:
    image: vllm/vllm-openai:latest
    command: >
      --model ${REVIEWER_MODEL:-mistralai/Devstral-Small-2507}
      --served-model-name reviewer
      --max-model-len 16384
      --gpu-memory-utilization 0.85
    ports:
      - "127.0.0.1:8001:8000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${REVIEWER_GPU_ID:-1}"]
              capabilities: [gpu]
    volumes:
      - hf-cache:/root/.cache/huggingface
    networks:
      - model-server-egress
    restart: unless-stopped

  # Optional: PostgreSQL matching the sample spec's technical hints.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: example
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - model-server-egress
    profiles:
      - sample-db

networks:
  coder-model-internal:
    name: tenninety-coder-model
    internal: true
  model-server-egress:
    internal: false # model-server downloads only; sandbox role containers never join it

volumes:
  hf-cache:
