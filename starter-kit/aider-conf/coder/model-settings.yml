# Settings for the local models served by llama-swap, which aider's built-in
# registry does not know. `name` must match the full model name (including the
# `openai/` prefix) used in aider.conf.yml. This file is identical in both
# profiles; aider picks the entry matching the active model.
- name: openai/qwen-coder
  edit_format: diff
  use_repo_map: false
  use_temperature: false      # sampling is fixed server-side in ~/llama-swap/config.yaml
  extra_params:
    max_tokens: 8192
- name: openai/devstral-reviewer
  edit_format: diff
  use_repo_map: false
  use_temperature: false
  extra_params:
    max_tokens: 8192
