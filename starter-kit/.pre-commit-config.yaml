repos:
  - repo: local
    hooks:
      - id: no-raw-sql
        name: block staged raw SQL strings in C#
        entry: scripts/check_no_raw_sql.sh
        language: system
        pass_filenames: false
      - id: signature-drift
        name: block signature changes without .agent/rules/architecture.md update
        entry: scripts/check_signatures.sh --staged
        language: system
        pass_filenames: false
      - id: dotnet-format
        name: verify code formatting
        entry: dotnet format --verify-no-changes --severity warn
        language: system
        pass_filenames: false
        # 'files' regex rather than 'types: [csharp]': pre-commit's identify
        # database tags .cs files as "c#", and an unknown tag makes pre-commit
        # reject the whole config.
        files: '\.cs$'
