name: ci

# Continuous verification: clean locked restore, Release build with warnings as errors,
# the complete non-Docker test suite, and static configuration checks. Live Docker test
# categories stay opt-in (they require provisioned images/networks) and are documented in
# docs/TESTER-SANDBOX.md; this workflow never runs them.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the whitespace check can compute the pull-request/push base
          # (merge-base) instead of scanning rolling history.
          fetch-depth: 0

      - name: Setup .NET 10 (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Print .NET SDK
        run: dotnet --info

      # The static checks declare their Python dependencies at pinned versions in
      # scripts/ci/requirements.txt; they are installed into a fresh virtualenv here. The
      # check script itself never performs an implicit pip install.
      - name: Install pinned static-check dependencies
        run: |
          python3 -m venv .venv-static-checks
          .venv-static-checks/bin/pip install --disable-pip-version-check \
            -r scripts/ci/requirements.txt

      - name: Clean locked restore (dependency drift fails here)
        run: dotnet restore tenninety.slnx --locked-mode

      # Warnings are errors for the framework projects. The test project still carries a
      # small set of pre-existing xunit-analyzer warnings; cleaning those up is tracked
      # separately and must not block dependency drift / build / test verification.
      - name: Release build (warnings visible)
        run: dotnet build tenninety.slnx -c Release --no-restore

      - name: Framework build (warnings are errors)
        run: >
          dotnet build src/Tenninety.Cli/Tenninety.Cli.csproj -c Release --no-restore
          -p:TreatWarningsAsErrors=true

      - name: Full non-Docker test suite
        run: dotnet test tests/Tenninety.Tests/Tenninety.Tests.csproj -c Release --no-build --no-restore

      - name: Validate docker compose configuration
        run: docker compose config -q

      - name: Static configuration checks (JSON/YAML/XML syntax, Markdown links)
        env:
          PYTHON: ${{ github.workspace }}/.venv-static-checks/bin/python
        run: bash scripts/ci/static-checks.sh

      # Whitespace errors introduced by the changes under test only (including the local
      # index/worktree when the script is run before a push). A rolling
      # `git log --check` would fail on pre-existing whitespace issues in merged
      # history, which cannot be fixed without rewriting old commits.
      - name: Whitespace check (introduced changes only)
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_PUSH_BEFORE: ${{ github.event.before }}
        run: bash scripts/ci/whitespace-check.sh
